<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Saqib Ali — Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#101823;#0d1117" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#0f151d"/>
      <stop offset="100%" stop-color="#131b26">
        <animate attributeName="stop-color" values="#131b26;#18222f;#131b26" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="78%" cy="45%" r="46%">
      <stop offset="0%" stop-color="#f2b544" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#f2b544" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f2b544" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#8b949e" fill-opacity="0.10"/>
    </pattern>

    <linearGradient id="accentRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2b544"/>
      <stop offset="100%" stop-color="#f2b544" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="35%" stop-color="#e6edf3"/>
      <stop offset="50%" stop-color="#ffd98a"/>
      <stop offset="65%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#e6edf3"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="340" rx="14"/>
    </clipPath>

    <style>
      .layer { animation: float 6s ease-in-out infinite; }
      .l1 { animation-delay: 0s; }
      .l2 { animation-delay: .45s; }
      .l3 { animation-delay: .9s; }
      .l4 { animation-delay: 1.35s; }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-9px); }
      }

      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: .35; }
        50%      { opacity: 1; }
      }

      .haze { animation: haze 5s ease-in-out infinite; }
      @keyframes haze {
        0%, 100% { opacity: .55; }
        50%      { opacity: 1; }
      }

      .rule { animation: grow 4.5s ease-in-out infinite; transform-origin: left center; }
      @keyframes grow {
        0%, 100% { transform: scaleX(.55); opacity: .6; }
        50%      { transform: scaleX(1);   opacity: 1; }
      }

      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      .spark { animation: rise 4.5s ease-in infinite; }
      .s2 { animation-delay: .9s; }
      .s3 { animation-delay: 1.8s; }
      .s4 { animation-delay: 2.6s; }
      .s5 { animation-delay: 3.4s; }
      @keyframes rise {
        0%   { opacity: 0;  transform: translateY(14px); }
        18%  { opacity: .9; }
        75%  { opacity: .5; }
        100% { opacity: 0;  transform: translateY(-96px); }
      }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect class="haze" width="1200" height="340" fill="url(#glow)"/>
    <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="13.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

    <g transform="translate(945,152)">

      <g fill="#f2b544">
        <circle class="spark s1" cx="-38" cy="60" r="2.4"/>
        <circle class="spark s2" cx="16"  cy="72" r="1.9"/>
        <circle class="spark s3" cx="48"  cy="56" r="2.6"/>
        <circle class="spark s4" cx="-14" cy="78" r="1.7"/>
        <circle class="spark s5" cx="-62" cy="66" r="2.1"/>
      </g>

      <g transform="translate(0,75)"><g class="layer l4">
        <path d="M0,-52 L104,0 L0,52 L-104,0 Z" fill="#1c2531"/>
        <path d="M-104,0 L0,52 L0,64 L-104,12 Z" fill="#151d27"/>
        <path d="M104,0 L0,52 L0,64 L104,12 Z" fill="#111822"/>
        <path d="M0,-52 L104,0 L0,52 L-104,0 Z" fill="none" stroke="#2f3a48" stroke-width="1.25"/>
      </g></g>

      <g transform="translate(0,25)"><g class="layer l3">
        <path d="M0,-52 L104,0 L0,52 L-104,0 Z" fill="#26313f"/>
        <path d="M-104,0 L0,52 L0,64 L-104,12 Z" fill="#1c2532"/>
        <path d="M104,0 L0,52 L0,64 L104,12 Z" fill="#161e29"/>
        <path d="M0,-52 L104,0 L0,52 L-104,0 Z" fill="none" stroke="#3b4859" stroke-width="1.25"/>
      </g></g>

      <g transform="translate(0,-25)"><g class="layer l2">
        <path d="M0,-52 L104,0 L0,52 L-104,0 Z" fill="#32414f"/>
        <path d="M-104,0 L0,52 L0,64 L-104,12 Z" fill="#25313d"/>
        <path d="M104,0 L0,52 L0,64 L104,12 Z" fill="#1d2733"/>
        <path d="M0,-52 L104,0 L0,52 L-104,0 Z" fill="none" stroke="#4a5b6d" stroke-width="1.25"/>
      </g></g>

      <g transform="translate(0,-75)"><g class="layer l1">
        <path d="M0,-52 L104,0 L0,52 L-104,0 Z" fill="#f2b544" fill-opacity="0.14"/>
        <path d="M-104,0 L0,52 L0,64 L-104,12 Z" fill="#f2b544" fill-opacity="0.10"/>
        <path d="M104,0 L0,52 L0,64 L104,12 Z" fill="#f2b544" fill-opacity="0.06"/>
        <path d="M0,-52 L104,0 L0,52 L-104,0 Z" fill="none" stroke="#f2b544" stroke-width="1.75"/>
        <circle class="pulse" cx="0" cy="0" r="4.5" fill="#f2b544"/>
        <circle class="pulse" cx="0" cy="0" r="13" fill="none" stroke="#f2b544" stroke-width="1"/>
      </g></g>

      <line x1="0" y1="-75" x2="0" y2="75" stroke="#f2b544" stroke-opacity="0.30"
            stroke-width="1.4" stroke-dasharray="4 7">
        <animate attributeName="stroke-dashoffset" values="22;0" dur="1.6s" repeatCount="indefinite"/>
      </line>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="72" y="96" font-size="14" letter-spacing="4.5" fill="#f2b544" fill-opacity="0.95">FULL-STACK DEVELOPER</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="70" y="172" font-size="66" font-weight="700" fill="url(#shimmer)" letter-spacing="-1.5">Saqib Ali</text>
    </g>

    <rect class="rule" x="72" y="196" width="150" height="2.5" fill="url(#accentRule)"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="238" font-size="20" fill="#adbac7">Next.js · React · TypeScript · Node.js</text>
      <text x="72" y="276" font-size="16.5" fill="#7d8590">I build production systems — and deploy them myself.</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="72" y="308" font-size="12.5" letter-spacing="1.6" fill="#5c6570">KARACHI, PAKISTAN &#183; UTC+5 &#183; REMOTE</text>
      <rect class="caret" x="316" y="297" width="8" height="14" fill="#f2b544"/>
    </g>
  </g>
</svg>
