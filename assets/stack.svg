    </linearGradient>
    <radialGradient id="glows" cx="94%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#f2b544" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#f2b544" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotss" width="22" height="22" patternUnits="userSpaceOnUse">
