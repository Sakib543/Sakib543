      }
      .beats { animation: beats 2.8s ease-in-out infinite; }
      @keyframes beats { 0%,100%{opacity:.3} 50%{opacity:1} }
      .drifts { animation: drifts 7s ease-in-out infinite; }
      @keyframes drifts {
        0%,100% { transform: translateY(0) rotate(0deg); }
        50%     { transform: translateY(-7px) rotate(3deg); }
      }
    </style>
