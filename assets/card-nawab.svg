<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-label="Nawab Pakwan">
  <defs>
    <linearGradient id="bga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#141d29"/>
    </linearGradient>
    <radialGradient id="glowa" cx="88%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#f2b544" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#f2b544" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsa" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#8b949e" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="rulea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2b544"/>
      <stop offset="100%" stop-color="#f2b544" stop-opacity="0"/>
    </linearGradient>
    <style>
      .accentbara { animation: sweepa 5s ease-in-out infinite; transform-origin: left center; }
      @keyframes sweepa {
        0%,100% { transform: scaleX(.35); opacity:.55; }
        50%     { transform: scaleX(1);   opacity:1; }
      }
      .beata { animation: beata 2.8s ease-in-out infinite; }
      @keyframes beata { 0%,100%{opacity:.3} 50%{opacity:1} }
      .drifta { animation: drifta 7s ease-in-out infinite; }
      @keyframes drifta {
        0%,100% { transform: translateY(0) rotate(0deg); }
        50%     { transform: translateY(-7px) rotate(3deg); }
      }
    </style>
  </defs>
  <rect width="600" height="380" rx="14" fill="url(#bga)"/>
  <rect width="600" height="380" rx="14" fill="url(#dotsa)"/>
  <rect width="600" height="380" rx="14" fill="url(#glowa)"/>
  <rect x="0.75" y="0.75" width="598.5" height="378.5" rx="13.25" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- decorative iso mark -->
  <g class="drifta" transform="translate(524,78)" opacity="0.5">
    <path d="M0,-26 L52,0 L0,26 L-52,0 Z" fill="none" stroke="#f2b544" stroke-opacity="0.35" stroke-width="1.3"/>
    <path d="M0,-14 L28,0 L0,14 L-28,0 Z" fill="#f2b544" fill-opacity="0.10"/>
    <circle class="beata" cx="0" cy="0" r="3" fill="#f2b544"/>
  </g>

  <rect class="accentbara" x="40" y="40" width="86" height="2.5" fill="url(#rulea)"/>
  <text x="40" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.6" fill="#f2b544" fill-opacity="0.9">REAL-TIME SYSTEM</text>
  <text x="38" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">Nawab Pakwan</text>
  <text x="40" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c6570">Restaurant ordering platform · sole developer</text>

  <text x="40" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">Four surfaces on one system: storefront, kitchen console,</text><text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">rider app, owner dashboard. Socket.IO with a polling fallback,</text><text x="40" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">server-side price validation, JWT in httpOnly cookies with</text><text x="40" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">token versioning. Deployed on EC2 by me.</text>

  <line x1="40" y1="232" x2="560" y2="232" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f2b544">194</text><text x="40" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.3" fill="#5c6570">BACKEND TESTS</text><text x="220" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f2b544">4</text><text x="220" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.3" fill="#5c6570">SURFACES</text><text x="400" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f2b544">3</text><text x="400" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.3" fill="#5c6570">USER ROLES</text>

  <g><rect x="40" y="316" width="102" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="91" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">Next.js 16</text></g><g><rect x="150.0" y="316" width="87" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="193" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">React 19</text></g><g><rect x="244.8" y="316" width="102" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="296" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">TypeScript</text></g><g><rect x="354.8" y="316" width="56" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="383" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">Node</text></g><g><rect x="419.20000000000005" y="316" width="79" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="459" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">MongoDB</text></g><g><rect x="40" y="344" width="94" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="87" y="359" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">Socket.IO</text></g><g><rect x="142.39999999999998" y="344" width="79" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="182" y="359" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">AWS EC2</text></g>
</svg>
