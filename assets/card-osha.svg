<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-label="OSHA Training School">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#141d29"/>
    </linearGradient>
    <radialGradient id="glowc" cx="88%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#f2b544" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#f2b544" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsc" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#8b949e" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="rulec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2b544"/>
      <stop offset="100%" stop-color="#f2b544" stop-opacity="0"/>
    </linearGradient>
    <style>
      .accentbarc { animation: sweepc 5s ease-in-out infinite; transform-origin: left center; }
      @keyframes sweepc {
        0%,100% { transform: scaleX(.35); opacity:.55; }
        50%     { transform: scaleX(1);   opacity:1; }
      }
      .beatc { animation: beatc 2.8s ease-in-out infinite; }
      @keyframes beatc { 0%,100%{opacity:.3} 50%{opacity:1} }
      .driftc { animation: driftc 7s ease-in-out infinite; }
      @keyframes driftc {
        0%,100% { transform: translateY(0) rotate(0deg); }
        50%     { transform: translateY(-7px) rotate(3deg); }
      }
    </style>
  </defs>
  <rect width="600" height="380" rx="14" fill="url(#bgc)"/>
  <rect width="600" height="380" rx="14" fill="url(#dotsc)"/>
  <rect width="600" height="380" rx="14" fill="url(#glowc)"/>
  <rect x="0.75" y="0.75" width="598.5" height="378.5" rx="13.25" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- decorative iso mark -->
  <g class="driftc" transform="translate(524,78)" opacity="0.5">
    <path d="M0,-26 L52,0 L0,26 L-52,0 Z" fill="none" stroke="#f2b544" stroke-opacity="0.35" stroke-width="1.3"/>
    <path d="M0,-14 L28,0 L0,14 L-28,0 Z" fill="#f2b544" fill-opacity="0.10"/>
    <circle class="beatc" cx="0" cy="0" r="3" fill="#f2b544"/>
  </g>

  <rect class="accentbarc" x="40" y="40" width="86" height="2.5" fill="url(#rulec)"/>
  <text x="40" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.6" fill="#f2b544" fill-opacity="0.9">US CLIENT · LIVE</text>
  <text x="38" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">OSHA Training School</text>
  <text x="40" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c6570">LMS e-commerce platform · team of two</text>

  <text x="40" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">Storefront for an OSHA-authorized US training provider.</text><text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">Edwiser Bridge connects WooCommerce to a Moodle LMS, so a</text><text x="40" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">purchase provisions the learner's enrolment automatically —</text><text x="40" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">no manual step between payment and access.</text>

  <line x1="40" y1="232" x2="560" y2="232" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f2b544">60+</text><text x="40" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.3" fill="#5c6570">COURSES</text><text x="220" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f2b544">2</text><text x="220" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.3" fill="#5c6570">LANGUAGES</text><text x="400" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f2b544">USA</text><text x="400" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.3" fill="#5c6570">MARKET</text>

  <g><rect x="40" y="316" width="94" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="87" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">WordPress</text></g><g><rect x="142.39999999999998" y="316" width="110" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="197" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">WooCommerce</text></g><g><rect x="260.0" y="316" width="72" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="296" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">Moodle</text></g><g><rect x="339.6" y="316" width="132" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="406" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">Edwiser Bridge</text></g><g><rect x="480.0" y="316" width="49" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="504" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">PHP</text></g>
</svg>
