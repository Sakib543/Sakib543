<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-label="Al Rehman Security">
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#141d29"/>
    </linearGradient>
    <radialGradient id="glowd" cx="88%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#f2b544" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#f2b544" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsd" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#8b949e" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="ruled" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2b544"/>
      <stop offset="100%" stop-color="#f2b544" stop-opacity="0"/>
    </linearGradient>
    <style>
      .accentbard { animation: sweepd 5s ease-in-out infinite; transform-origin: left center; }
      @keyframes sweepd {
        0%,100% { transform: scaleX(.35); opacity:.55; }
        50%     { transform: scaleX(1);   opacity:1; }
      }
      .beatd { animation: beatd 2.8s ease-in-out infinite; }
      @keyframes beatd { 0%,100%{opacity:.3} 50%{opacity:1} }
      .driftd { animation: driftd 7s ease-in-out infinite; }
      @keyframes driftd {
        0%,100% { transform: translateY(0) rotate(0deg); }
        50%     { transform: translateY(-7px) rotate(3deg); }
      }
    </style>
  </defs>
  <rect width="600" height="380" rx="14" fill="url(#bgd)"/>
  <rect width="600" height="380" rx="14" fill="url(#dotsd)"/>
  <rect width="600" height="380" rx="14" fill="url(#glowd)"/>
  <rect x="0.75" y="0.75" width="598.5" height="378.5" rx="13.25" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- decorative iso mark -->
  <g class="driftd" transform="translate(524,78)" opacity="0.5">
    <path d="M0,-26 L52,0 L0,26 L-52,0 Z" fill="none" stroke="#f2b544" stroke-opacity="0.35" stroke-width="1.3"/>
    <path d="M0,-14 L28,0 L0,14 L-28,0 Z" fill="#f2b544" fill-opacity="0.10"/>
    <circle class="beatd" cx="0" cy="0" r="3" fill="#f2b544"/>
  </g>

  <rect class="accentbard" x="40" y="40" width="86" height="2.5" fill="url(#ruled)"/>
  <text x="40" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2.6" fill="#f2b544" fill-opacity="0.9">MARKETING SITE</text>
  <text x="38" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">Al Rehman Security</text>
  <text x="40" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c6570">Licensed security company · sole developer</text>

  <text x="40" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">Nine server-rendered pages built around six service verticals,</text><text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">so a visitor lands on their own situation instead of generic</text><text x="40" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">copy. Animated statistics, validated enquiry form, maps, and</text><text x="40" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">full Open Graph and local SEO metadata.</text>

  <line x1="40" y1="232" x2="560" y2="232" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f2b544">9</text><text x="40" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.3" fill="#5c6570">PAGES</text><text x="220" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f2b544">6</text><text x="220" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.3" fill="#5c6570">VERTICALS</text><text x="400" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#f2b544">SSR</text><text x="400" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.3" fill="#5c6570">RENDERING</text>

  <g><rect x="40" y="316" width="79" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="80" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">Next.js</text></g><g><rect x="127.19999999999999" y="316" width="64" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="159" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">React</text></g><g><rect x="199.2" y="316" width="102" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="250" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">TypeScript</text></g><g><rect x="309.2" y="316" width="87" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="353" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">Tailwind</text></g><g><rect x="404.0" y="316" width="49" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="428" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">SEO</text></g><g><rect x="460.8" y="316" width="72" height="22" rx="11" fill="#f2b544" fill-opacity="0.07" stroke="#f2b544" stroke-opacity="0.28"/><text x="497" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f2b544" fill-opacity="0.92" text-anchor="middle">Vercel</text></g>
</svg>
