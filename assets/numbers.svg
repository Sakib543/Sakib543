<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 132" width="860" height="132" role="img" aria-label="By the numbers">
  <defs>
    <linearGradient id="bgn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#141d29"/>
    </linearGradient>
    <radialGradient id="glown" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#f2b544" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#f2b544" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsn" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#8b949e" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="rulen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2b544"/>
      <stop offset="100%" stop-color="#f2b544" stop-opacity="0"/>
    </linearGradient>
    <style>
      .accentbarn { animation: sweepn 5s ease-in-out infinite; transform-origin: left center; }
      @keyframes sweepn {
        0%,100% { transform: scaleX(.35); opacity:.55; }
        50%     { transform: scaleX(1);   opacity:1; }
      }
      .beatn { animation: beatn 2.8s ease-in-out infinite; }
      @keyframes beatn { 0%,100%{opacity:.3} 50%{opacity:1} }
      .driftn { animation: driftn 7s ease-in-out infinite; }
      @keyframes driftn {
        0%,100% { transform: translateY(0) rotate(0deg); }
        50%     { transform: translateY(-7px) rotate(3deg); }
      }
    </style>
  </defs>
  <rect width="860" height="132" rx="14" fill="url(#bgn)"/>
  <rect width="860" height="132" rx="14" fill="url(#dotsn)"/>
  <rect width="860" height="132" rx="14" fill="url(#glown)"/>
  <rect x="0.75" y="0.75" width="858.5" height="130.5" rx="13.25" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="40" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e6edf3">~3</text><text x="40" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5c6570">YEARS SHIPPING</text><circle class="beatn" cx="44" cy="36" r="3" fill="#f2b544" style="animation-delay:0.0s"/><text x="245" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e6edf3">500+</text><text x="245" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5c6570">AUTOMATED TESTS</text><line x1="213" y1="42" x2="213" y2="102" stroke="#30363d" stroke-width="1"/><circle class="beatn" cx="249" cy="36" r="3" fill="#f2b544" style="animation-delay:0.5s"/><text x="450" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e6edf3">6</text><text x="450" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5c6570">SITES IN PRODUCTION</text><line x1="418" y1="42" x2="418" y2="102" stroke="#30363d" stroke-width="1"/><circle class="beatn" cx="454" cy="36" r="3" fill="#f2b544" style="animation-delay:1.0s"/><text x="655" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e6edf3">2</text><text x="655" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5c6570">COUNTRIES SERVED</text><line x1="623" y1="42" x2="623" y2="102" stroke="#30363d" stroke-width="1"/><circle class="beatn" cx="659" cy="36" r="3" fill="#f2b544" style="animation-delay:1.5s"/>
</svg>
